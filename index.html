<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f4ee"><meta name="description" content="6 вопросов, чтобы узнать свой ведущий архетип и сильную сторону в команде."><title>Твой архетип — короткий тест</title>
<style>
:root{--bg:#f6f4ee;--ink:#26392e;--muted:#68766c;--line:#dce0d6;--green:#346347;--lime:#e4edb3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #719344;outline-offset:4px}header{max-width:1120px;margin:auto;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:700;letter-spacing:-.6px;font-size:20px}.brand span{display:inline-grid;place-items:center;width:29px;height:29px;margin-right:9px;border-radius:50%;background:var(--green);color:var(--lime)}.label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}main{max-width:1040px;margin:0 auto;padding:52px 28px 35px;min-height:78vh}h1,h2,p{margin-top:0}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(44px,6.5vw,78px);line-height:1.07;letter-spacing:-2px;margin-bottom:24px}h1 em{color:var(--green);font-weight:400}h2{font-family:Georgia,serif;font-size:clamp(27px,4vw,39px);font-weight:400;line-height:1.22;letter-spacing:-.7px}.lead{font-size:17px;color:var(--muted);max-width:465px}.hero{display:grid;grid-template-columns:1.12fr 1fr;gap:44px;align-items:center;padding:14px 0 25px}.eyebrow{display:inline-block;margin-bottom:24px;color:var(--green);font-size:11px;letter-spacing:2px;text-transform:uppercase}.primary,.secondary{border:0;border-radius:12px;padding:16px 24px;font-weight:600;display:inline-flex;justify-content:center;align-items:center;gap:20px}.primary{background:var(--green);color:white}.primary:hover{background:#254f36}.primary:disabled{opacity:.45;cursor:default}.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.small{font-size:12px;color:var(--muted)}.meta{display:flex;gap:22px;margin:24px 0 28px;font-size:13px}.meta span:before{content:'✦';color:var(--green);margin-right:8px}.art{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#e6ebd7 0,transparent 68%)}.orbit{width:67%;height:67%;border:1px solid #b7c6af;border-radius:50%;position:absolute}.orbit:after{content:'';position:absolute;inset:18%;border:1px dashed #b7c6af;border-radius:50%}.center{font:italic 84px Georgia;color:var(--green);z-index:1}.petal{position:absolute;width:110px;padding:11px 6px;border-radius:12px;background:#fffefa;border:1px solid var(--line);font-size:12px;text-align:center;box-shadow:0 5px 18px #26392e06}.petal b{display:block;font-size:24px;font-weight:400;margin-bottom:5px}.p0{top:2%;left:35%}.p1{top:26%;right:-2%}.p2{bottom:15%;right:1%}.p3{bottom:1%;left:30%}.p4{bottom:26%;left:-7%}.p5{top:16%;left:-3%}.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;border-top:1px solid var(--line);padding-top:25px;margin-top:35px}.strip strong{display:block;font-size:14px;margin-bottom:5px}.strip p{font-size:12px;color:var(--muted)}footer{max-width:1120px;margin:0 auto;padding:20px 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted)}.quiz{max-width:720px;margin:auto}.progress-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:12px}.progress{height:5px;border-radius:4px;background:#e1e5da;margin-bottom:32px}.progress i{display:block;background:var(--green);height:100%;border-radius:4px;transition:width .25s}.context{color:var(--green);font-size:12px;margin-bottom:12px}.options{display:grid;gap:10px;margin:24px 0}.option{width:100%;text-align:left;background:#fffefa;border:1px solid var(--line);border-radius:12px;padding:15px 18px;color:var(--ink);display:flex;gap:13px;align-items:center;font-size:14px}.option:hover{border-color:#8fa887}.option.selected{background:#eaf0db;border-color:var(--green)}.radio{flex-shrink:0;border:1px solid #a9b8a5;border-radius:50%;width:18px;height:18px;display:grid;place-items:center}.selected .radio:after{content:'';width:10px;height:10px;border-radius:50%;background:var(--green)}.nav{display:flex;justify-content:space-between;gap:16px;margin-top:25px}.result{max-width:720px;margin:auto}.result-card{background:#fffefa;border:1px solid var(--line);border-radius:22px;padding:36px;margin-bottom:22px}.result-card h1{font-size:58px;margin-bottom:18px}.result-symbol{display:inline-grid;place-items:center;background:var(--lime);border-radius:18px;font:40px Georgia;width:76px;height:76px;margin-bottom:24px}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:5px 11px;margin:0 6px 8px 0;font-size:12px}.notice{padding:20px 22px;background:#e8eddd;border-radius:14px;margin:24px 0}.notice p{margin:6px 0 0;font-size:14px}.score{display:grid;grid-template-columns:120px 1fr 37px;align-items:center;gap:14px;font-size:12px;margin:13px 0}.bar{height:6px;background:#edf0e7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#7c9d6b}.actions{display:flex;flex-wrap:wrap;gap:10px}.toast{min-height:24px;font-size:12px;color:var(--green);margin-top:10px}details{margin-top:22px}summary{cursor:pointer;font-size:13px;color:var(--muted)}.fade{animation:appear .25s ease-out}@keyframes appear{from{opacity:.2;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:700px){header{padding:20px}.label{font-size:9px;letter-spacing:1px}main{padding:30px 20px;min-height:80vh}.hero{grid-template-columns:1fr;gap:12px}.art{max-width:300px;width:90%;margin:24px auto 0}.petal{width:92px;font-size:10px;padding:8px}.petal b{font-size:19px}.center{font-size:62px}.strip{gap:14px;margin-top:24px}.strip p{font-size:11px}.meta{gap:16px}.result-card{padding:24px}.result-card h1{font-size:44px}footer{padding:20px;display:block}footer span{display:block;margin:3px 0}.quiz h2{font-size:29px}.option{padding:13px;font-size:13px}.primary,.secondary{padding:14px 20px}.score{grid-template-columns:105px 1fr 30px;gap:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><div class="brand"><span>✳</span>Твой архетип</div><div class="label">6 способов быть собой</div></header><main id="app"></main><footer><span>Небольшой тест. Новая точка зрения на себя.</span><span>Для саморефлексии · Не психологическая диагностика</span></footer><noscript>Для прохождения теста включите JavaScript в настройках браузера.</noscript>
<script>
'use strict';
const types=[
{id:'strategist',name:'Стратег',icon:'◎',tag:'Видеть дальше. Думать системно.',description:'Вы замечаете общую картину, связываете факты и превращаете неопределённость в понятный маршрут. Ваша сильная сторона — понимать, куда двигаться и почему.',strengths:['Системное мышление','Планирование','Анализ'],risk:'Можно увлечься поиском идеального плана и отложить первый шаг.',tip:'Выберите одну цель, обозначьте три шага к ней и проверьте первый на практике.'},
{id:'leader',name:'Лидер',icon:'↗',tag:'Задавать направление. Вести к результату.',description:'Вы готовы брать ответственность, принимать решения и помогать команде двигаться вперёд. Ваша сильная сторона — объединять усилия вокруг общей цели.',strengths:['Ответственность','Решительность','Организация'],risk:'В стремлении ускорить результат можно взять на себя слишком много.',tip:'Обозначьте желаемый результат и распределите ответственность, оставив людям пространство для своих решений.'},
{id:'communicator',name:'Коммуникатор',icon:'≈',tag:'Слышать людей. Находить общий язык.',description:'Вы чувствуете атмосферу, умеете слушать и объяснять сложное понятными словами. Ваша сильная сторона — помогать людям услышать друг друга и договориться.',strengths:['Эмпатия','Диалог','Ясность'],risk:'Желание сохранить хорошие отношения иногда мешает прямо сказать о своих потребностях.',tip:'В следующем разговоре назовите свою потребность и уточните, что важно собеседнику.'},
{id:'creator',name:'Создатель',icon:'✳',tag:'Придумывать. Придавать форму.',description:'Вы видите возможности для нового и любите превращать идеи в то, что можно увидеть, попробовать или использовать. Ваша сильная сторона — создавать оригинальные решения.',strengths:['Воображение','Оригинальность','Воплощение'],risk:'Новые идеи могут отвлекать от завершения уже начатого.',tip:'Выберите одну идею и сделайте её простую первую версию, которую можно показать другим.'},
{id:'magician',name:'Фокусник',icon:'✧',tag:'Менять взгляд. Находить неожиданный ход.',description:'Вы умеете переосмыслить привычную задачу и заметить выход там, где другие видят тупик. Ваша сильная сторона — открывать новые возможности через смену подхода.',strengths:['Гибкость','Находчивость','Переосмысление'],risk:'Необычный ход может выглядеть убедительно ещё до того, как проверена его работоспособность.',tip:'Сформулируйте неожиданный подход к задаче и проверьте его небольшим экспериментом.'},
{id:'networker',name:'Нетворкер',icon:'⋈',tag:'Соединять людей. Открывать возможности.',description:'Вы замечаете, кому может быть полезно знакомство, и легко находите нужных людей. Ваша сильная сторона — создавать связи, из которых вырастают совместные возможности.',strengths:['Знакомства','Партнёрства','Обмен ресурсами'],risk:'Широкий круг контактов требует внимания: знакомство само по себе ещё не превращается в сотрудничество.',tip:'Выберите один контакт и предложите конкретный совместный шаг, полезный вам обоим.'}
];
const questions=[
{title:'Вы начинаете новый проект. Что хочется сделать в первую очередь?',answers:['Разобраться в цели, собрать факты и наметить план.','Собрать команду и распределить ответственность.','Обсудить ожидания и убедиться, что все понимают друг друга.','Придумать концепцию и набросать первую версию.','Проверить, можно ли решить задачу совсем другим способом.','Найти людей и партнёров, которые помогут проекту.']},
{title:'Команда столкнулась с неожиданным препятствием. Ваш первый шаг?',branches:['План готов, но обстоятельства изменились.','Команда собрана, но работа застопорилась.','Ожидания обсудили, но появилась новая сложность.','Первая идея есть, но воплотить её оказалось непросто.','Необычный подход найден, но возникло препятствие.','Нужные люди найдены, но задача всё ещё не решена.'],answers:['Разобрать причины и пересчитать возможные сценарии.','Принять решение и организовать следующие действия.','Выслушать участников и снять напряжение в обсуждении.','Сделать новый вариант решения или прототип.','Перевернуть условие задачи и попробовать неожиданный ход.','Обратиться к знакомому, у которого есть нужный опыт.']},
{title:'Вам предлагают помочь с мероприятием. Какую роль вы выберете?',answers:['Продумать программу, сроки и возможные риски.','Координировать подготовку и отвечать за результат.','Вести обсуждения и помогать участникам общаться.','Разработать оформление, контент или оригинальный формат.','Придумать необычный поворот, который изменит впечатление гостей.','Пригласить интересных людей и найти партнёров.']},
{title:'Чья похвала для вас звучит особенно точно?',answers:['«Ты помог увидеть всю картину и выбрать верный путь».','«С тобой мы собрались и довели дело до результата».','«Благодаря тебе мы услышали и поняли друг друга».','«Ты придумал то, чего раньше просто не было».','«Ты нашёл выход, который никто не замечал».','«Ты познакомил нас с человеком, который оказался очень нужен».']},
{title:'У вас появился свободный час для важной задачи. На что его потратите?',answers:['Сравню варианты и определю, что даст лучший эффект.','Возьму самый важный вопрос и продвину его к решению.','Обсужу задачу с участниками, чтобы лучше понять их потребности.','Создам что-то конкретное: текст, эскиз или первую версию.','Проверю смелую гипотезу, которая может всё упростить.','Свяжусь с людьми, с которыми можно объединить усилия.']},
{title:'Что приносит вам больше всего удовлетворения в общем деле?',branches:['Вы уже сравнили варианты и увидели возможный путь.','Вы уже помогли важному вопросу сдвинуться с места.','Вы уже лучше поняли потребности участников.','Вы уже сделали первую версию решения.','Вы уже проверили нестандартную гипотезу.','Вы уже нашли возможность объединить усилия.'],answers:['Видеть, что продуманная стратегия сработала.','Понимать, что команда достигла цели благодаря общим усилиям.','Чувствовать, что между людьми появились ясность и доверие.','Держать в руках результат, выросший из моей идеи.','Замечать, как смена подхода превратила тупик в возможность.','Видеть, как знакомство стало полезным сотрудничеством.']}
];
let answers=[],step=-1,chosen=null;
const app=document.getElementById('app');
function save(){try{sessionStorage.setItem('archetype-v1',JSON.stringify({answers,step}));}catch{}}
function calculate(values){const scores=types.map((_,i)=>values.filter(v=>v===i).length);const max=Math.max(...scores);const tied=scores.map((s,i)=>s===max?i:-1).filter(i=>i>=0);const winner=[...values].reverse().find(i=>tied.includes(i));return{scores,winner,tied};}
function home(){app.innerHTML=`<section class="hero fade"><div><span class="eyebrow">У каждого своя сильная сторона</span><h1>А в чём<br>ваша <em>сила?</em></h1><p class="lead">Узнайте, какой архетип проявляется в ваших решениях, общении и подходе к делу.</p><div class="meta"><span>6 вопросов</span><span>Около 2 минут</span></div><button class="primary" id="start">Узнать свой архетип <span>↗</span></button><p class="small" style="margin-top:14px">Без регистрации. Результат сразу после теста.</p></div><div class="art" aria-label="Шесть архетипов"><div class="orbit"></div><div class="center">вы</div>${types.map((t,i)=>`<div class="petal p${i}"><b>${t.icon}</b>${t.name}</div>`).join('')}</div></section><section class="strip"><div><strong>01 / Выбирайте честно</strong><p>Отмечайте то, как вы обычно действуете, а не как «правильно».</p></div><div><strong>02 / Доверяйте себе</strong><p>Если близки несколько ответов, выберите наиболее характерный.</p></div><div><strong>03 / Заберите результат</strong><p>Покажите свой архетип ведущей, чтобы получить инструкцию.</p></div></section>`;document.getElementById('start').onclick=()=>{step=0;answers=[];render();};}
function render(){chosen=answers[step]??null;save();if(step===6){result();return;}const q=questions[step];const context=q.branches&&step>0?q.branches[answers[step-1]]:'';const order=[0,1,2,3,4,5].map((_,i)=>(i+step*2)%6);app.innerHTML=`<section class="quiz fade"><div class="progress-top"><span>ВАШ ПУТЬ К СЕБЕ</span><span>Вопрос ${step+1} из 6</span></div><div class="progress"><i style="width:${(step+1)/6*100}%"></i></div>${context?`<p class="context">${context}</p>`:''}<h2 tabindex="-1">${q.title}</h2><p class="small">Выберите один наиболее близкий ответ.</p><div class="options" role="group" aria-label="Варианты ответа">${order.map(i=>`<button type="button" class="option ${chosen===i?'selected':''}" aria-pressed="${chosen===i}" data-choice="${i}"><span class="radio" aria-hidden="true"></span><span>${q.answers[i]}</span></button>`).join('')}</div><div class="nav"><button class="secondary" id="back">← Назад</button><button class="primary" id="next" ${chosen===null?'disabled':''}>${step===5?'Получить результат':'Дальше'} <span>→</span></button></div></section>`;
app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.choice);app.querySelectorAll('[data-choice]').forEach(el=>{const selected=Number(el.dataset.choice)===chosen;el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',selected);});document.getElementById('next').disabled=false;});document.getElementById('next').onclick=()=>{if(chosen===null)return;answers[step]=chosen;step++;render();window.scrollTo({top:0,behavior:'instant'});app.querySelector('h2,h1')?.focus();};document.getElementById('back').onclick=()=>{step--;if(step<0){save();home();}else render();};}
function result(){const {scores,winner,tied}=calculate(answers);const t=types[winner];const code=answers.map(v=>v+1).join('');const text=`Мой архетип — ${t.name}.\n${t.tag}\nПрофиль: ${types.map((x,i)=>x.name+' '+scores[i]+'/6').join(', ')}.\nКод ответов: ${code}.\nТест: ${location.origin+location.pathname}`;app.innerHTML=`<section class="result fade"><span class="eyebrow">Ваш результат · 6 из 6</span><div class="result-card"><div class="result-symbol">${t.icon}</div><h1 tabindex="-1">${t.name}</h1><p style="color:var(--green);font-size:18px">${t.tag}</p><p>${t.description}</p><div>${t.strengths.map(s=>`<span class="pill">${s}</span>`).join('')}</div><details><summary>Сильная сторона и точка роста</summary><p style="margin-top:16px">${t.risk}</p><p><strong>Попробуйте:</strong> ${t.tip}</p></details></div><div class="notice"><strong>Теперь покажите результат ведущей</strong><p>Она даст вам инструкцию для вашего архетипа. Можно сделать скриншот или скопировать результат кнопкой ниже.</p></div><div class="actions"><button class="primary" id="copy">Скопировать результат ↗</button><button class="secondary" id="restart">Пройти ещё раз</button></div><p class="toast" id="toast" role="status"></p><details><summary>Мой профиль и как считается результат</summary><p class="small">Каждый ответ добавляет один балл соответствующему архетипу. Главный результат — архетип с наибольшим числом баллов.${tied.length>1?' У вас равенство: '+tied.map(i=>types[i].name).join(', ')+'.':''} При равенстве выбран тот из лидирующих архетипов, который встречается в ваших ответах последним. Это условное правило для получения одного результата.</p>${types.map((x,i)=>`<div class="score"><span>${x.name}</span><div class="bar"><i style="width:${scores[i]/6*100}%"></i></div><span>${scores[i]}/6</span></div>`).join('')}<p class="small">Код ответов: ${code}. Результат описывает ваши выборы в этом тесте и может меняться в зависимости от ситуации.</p></details><p class="small" style="margin-top:24px">Ответы хранятся только в этой вкладке. Ведущая не получает их автоматически — передайте результат лично.</p></section>`;
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text);document.getElementById('toast').textContent='Результат скопирован. Отправьте его ведущей.';}catch{document.getElementById('toast').textContent='Скопируйте текст ниже или сделайте скриншот.';const ta=document.createElement('textarea');ta.value=text;ta.style.width='100%';ta.rows=6;document.getElementById('toast').after(ta);ta.select();}};document.getElementById('restart').onclick=()=>{answers=[];step=0;render();window.scrollTo(0,0);};}
try{const saved=JSON.parse(sessionStorage.getItem('archetype-v1'));if(saved&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<=6&&Array.isArray(saved.answers)&&saved.answers.length<=6&&saved.answers.every(v=>Number.isInteger(v)&&v>=0&&v<6)&&saved.answers.length>=saved.step){answers=saved.answers;step=saved.step;}}catch{}
if(step<0)home();else render();
</script></body></html>
